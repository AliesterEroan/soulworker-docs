[package]
name = "soulworker-docs"
version = "1.0.0"
description = "SoulWorker Docs - the item, warp and command records as a Windows app"
authors = ["AliesterEroan"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
